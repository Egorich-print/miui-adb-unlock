[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miui-adb-unlock"
version = "0.1.0"
description = "Enable MIUI developer options that are blocked for the adb identity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Egor Korostelev" }]
keywords = ["android", "miui", "adb", "uiautomator", "accessibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
miui-adb-unlock = "miui_adb_unlock.cli:main"

[tool.setuptools]
packages = ["miui_adb_unlock"]

[tool.setuptools.package-data]
miui_adb_unlock = ["py.typed"]
